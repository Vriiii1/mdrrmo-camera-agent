name: release
on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.400

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Build and pack release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          .\scripts\release.ps1 -Version $version -SkipSign

      - name: Upload release assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ./releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage Velopack feed files for gh-pages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./gh-pages-staging
          Copy-Item ./releases/releases.win.json ./gh-pages-staging/releases.win.json
          Copy-Item ./releases/assets.win.json   ./gh-pages-staging/assets.win.json

      - name: Publish Velopack feed to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-staging
          publish_branch: gh-pages
          keep_files: true
